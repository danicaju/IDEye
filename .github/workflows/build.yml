name: IDEye build matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12"]

    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 xvfb

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run headless test suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q --tb=short

      - name: Run headless test suite
        if: runner.os != 'Linux'
        run: python -m pytest -q --tb=short

      - name: Build standalone application
        run: python build_app.py

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: IDEye-${{ runner.os }}-py${{ matrix.python }}
          path: dist/
          retention-days: 2
          if-no-files-found: warn
