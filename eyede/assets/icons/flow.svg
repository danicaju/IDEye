<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background glow pill -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0c2033" stroke="#0e7490" stroke-width="1.5"/>
  <!-- Branching flowchart path -->
  <circle cx="32" cy="14" r="5" fill="#06b6d4" stroke="#e0f2fe" stroke-width="1.5"/>
  <path d="M 32 19 L 32 28" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diamond decision node -->
  <polygon points="32,28 42,35 32,42 22,35" fill="#0e7490" stroke="#38bdf8" stroke-width="2"/>
  <!-- Left branch -->
  <path d="M 22 35 L 16 35 L 16 48" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="48" r="4" fill="#38bdf8"/>
  <!-- Right branch -->
  <path d="M 42 35 L 48 35 L 48 48" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="48" r="4" fill="#06b6d4"/>
</svg>
