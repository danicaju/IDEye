<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0c1e3d" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- Cardinal directional arrows -->
  <!-- UP -->
  <polygon points="32,12 37,20 27,20" fill="#60a5fa"/>
  <!-- DOWN -->
  <polygon points="32,52 37,44 27,44" fill="#60a5fa"/>
  <!-- LEFT -->
  <polygon points="12,32 20,27 20,37" fill="#60a5fa"/>
  <!-- RIGHT -->
  <polygon points="52,32 44,27 44,37" fill="#60a5fa"/>
  <!-- Center cursor reticle -->
  <circle cx="32" cy="32" r="7" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="32" cy="32" r="2.5" fill="#3b82f6"/>
</svg>
