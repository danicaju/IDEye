<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pauseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#06261d" stroke="#047857" stroke-width="1.5"/>
  <!-- Gentle closed/sleeping/resting eye arc -->
  <path d="M 14 30 C 22 42, 42 42, 50 30" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyelashes / Resting ticks -->
  <line x1="20" y1="36" x2="17" y2="42" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="32" y2="45" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="36" x2="47" y2="42" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Two Pause Bars above -->
  <rect x="25" y="15" width="4" height="12" rx="2" fill="#10b981"/>
  <rect x="35" y="15" width="4" height="12" rx="2" fill="#10b981"/>
</svg>
