<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <!-- Pure Black Background with Subtle Border -->
    <linearGradient id="bgBW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rimBW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="irisBW" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e4e4e7"/>
      <stop offset="75%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#27272a"/>
    </radialGradient>
  </defs>

  <!-- Pure Minimalist Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgBW)" stroke="#27272a" stroke-width="1.5"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#rimBW)" stroke-width="1.5"/>

  <!-- Dark Sclera -->
  <path d="M 28 64 C 40 44, 88 44, 100 64 C 88 84, 40 84, 28 64 Z" fill="#000000" stroke="none"/>

  <!-- Left Code Bracket < in Crisp Pure White -->
  <path d="M 36 43 L 18 64 L 36 85" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Code Bracket > in Crisp Pure White -->
  <path d="M 92 43 L 110 64 L 92 85" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Minimalist White Eyelid Arches -->
  <path d="M 28 64 C 40 44, 88 44, 100 64" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M 28 64 C 40 84, 88 84, 100 64" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Monochrome Silver-White Iris Sphere -->
  <circle cx="64" cy="64" r="19.5" fill="url(#irisBW)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Pure Black Pupil -->
  <circle cx="64" cy="64" r="8.5" fill="#000000" stroke="#52525b" stroke-width="1.2"/>

  <!-- High-Contrast Specular Glint -->
  <circle cx="60.5" cy="59.5" r="3.2" fill="#ffffff"/>
  <circle cx="66.5" cy="65.5" r="1.6" fill="#ffffff" fill-opacity="0.8"/>
</svg>