<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <!-- Dark Sapphire Carbon Background -->
    <linearGradient id="bgFusion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Translucent Glass Rim (from Option 3) -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Fluid Sapphire Glass Gradient for Brackets & Lids -->
    <linearGradient id="bracketGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- 3D Convex Iris Sphere (from Option 3) -->
    <radialGradient id="iris3D" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#2563eb"/>
      <stop offset="90%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#050a16"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base with Glass Rim -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgFusion)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#glassRim)" stroke-width="1.5"/>

  <!-- Eye Sclera / Background Fill -->
  <path d="M 28 64 C 40 44, 88 44, 100 64 C 88 84, 40 84, 28 64 Z" fill="#040814" fill-opacity="0.9" stroke="none"/>

  <!-- Left Code Bracket extending into eye curve (from Option 2) -->
  <path d="M 36 43 L 18 64 L 36 85" fill="none" stroke="url(#bracketGlass)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Code Bracket extending into eye curve (from Option 2) -->
  <path d="M 92 43 L 110 64 L 92 85" fill="none" stroke="url(#bracketGlass)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cyber Horizon Eyelid Arches hugging the iris (from Option 2) -->
  <path d="M 28 64 C 40 44, 88 44, 100 64" fill="none" stroke="url(#bracketGlass)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 28 64 C 40 84, 88 84, 100 64" fill="none" stroke="url(#bracketGlass)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 3D Convex Iris Sphere (from Option 3) -->
  <circle cx="64" cy="64" r="19.5" fill="url(#iris3D)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Deep Obsidian Pupil -->
  <circle cx="64" cy="64" r="8.5" fill="#010308" stroke="#2563eb" stroke-width="1.2"/>

  <!-- Optical Dual Specular Catchlights (from Option 3) -->
  <circle cx="60.5" cy="59.5" r="3.2" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="66.5" cy="65.5" r="1.6" fill="#93c5fd" fill-opacity="0.8"/>
</svg>