<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#080e1d"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="glassTop4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bracketGlass4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="irisSphere4" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="30%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#070c1e"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base with Glass Rim -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg4)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#glassTop4)" stroke-width="1.5"/>

  <!-- Left Code Bracket < -->
  <path d="M 32 45 L 18 64 L 32 83" fill="none" stroke="url(#bracketGlass4)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Code Bracket > -->
  <path d="M 96 45 L 110 64 L 96 83" fill="none" stroke="url(#bracketGlass4)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cyber Eye Contour with Internal Depth -->
  <path d="M 35 64 C 44 47, 84 47, 93 64 C 84 81, 44 81, 35 64 Z" fill="#050a16" stroke="url(#bracketGlass4)" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- 3D Convex Iris Sphere -->
  <circle cx="64" cy="64" r="19" fill="url(#irisSphere4)" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Deep Pupil Core -->
  <circle cx="64" cy="64" r="8.5" fill="#02050e" stroke="#2563eb" stroke-width="1.2"/>

  <!-- Soft Specular Arc Glint -->
  <circle cx="60.5" cy="59.5" r="3.2" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="66.5" cy="65.5" r="1.6" fill="#93c5fd" fill-opacity="0.7"/>
</svg>
